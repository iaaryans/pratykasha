<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authentication • Pratyaksha | Advanced Attendance System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #c7d2fe 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .glass {
      background: rgba(255 255 255 / 0.75);
      backdrop-filter: blur(24px);
      border-radius: 1.5rem;
      border: 1px solid rgba(209, 213, 219, 0.3);
      box-shadow: 0 25px 50px rgba(0 0 0 / 0.05);
    }
    #preloader {
      transition: opacity 0.5s ease, visibility 0.5s ease;
      background: linear-gradient(135deg, #e0f2fe 0%, #c7d2fe 100%);
      z-index: 9999;
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease-out;
    }

  </style>
</head>
<body>

  <!-- Preloader -->
  <div id="preloader">
    <img src="image/logo.png" alt="Pratyaksha Logo" class="h-12 animate-pulse" />
  </div>

  <main class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-10 items-center min-h-[480px]">
    <!-- Illustration Panel -->
    <section
      class="hidden md:flex flex-col justify-center items-start space-y-6 px-6"
      aria-label="Illustration and marketing message"
    >
      <img src="image/login-visual.svg" alt="Login Visual" class="w-24 max-w-sm" />
      <h2 class="text-4xl font-semibold text-gray-800 leading-tight">Smart Attendance with Pratyaksha</h2>
      <p class="text-gray-600 text-base leading-relaxed max-w-md">
        Experience seamless attendance powered by advanced facial recognition and geolocation. Built for modern campuses.
      </p>
    </section>

    <!-- Auth Card -->
    <section
      class="glass p-8 rounded-3xl flex flex-col justify-between"
      aria-label="Authentication forms"
    >
      <div>
        <div class="mb-6 text-center">
          <img src="image/logo.png" alt="Pratyaksha Logo" class="mx-auto h-12" />
          <h2 id="formTitle" class="text-xl font-semibold mt-4 text-gray-800">
            Login to Your Account
          </h2>
        </div>

        <div id="formWrapper" class="relative flex flex-col gap-6">
          <!-- Login Form -->
          <form
            id="loginForm"
            class="flex flex-col gap-5 animate-fade-in-up"
            autocomplete="off"
            novalidate
          >
            <input
              id="authCode"
              type="text"
              placeholder="Auth Code"
              required
              autocomplete="username"
              class="w-full px-4 py-3 rounded-lg text-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <div>
              <label for="dateOfBirth" class="text-xs text-gray-600 mt-1 block select-none">Enter your Date of Birth</label>

              <input
                id="dateOfBirth"
                type="date"
                required
                aria-label="Enter your date of birth"
                class="w-full px-4 py-3 rounded-lg text-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium text-sm shadow-md transition duration-200"
            >
              Login
            </button>
            <p class="text-center text-gray-600" style="font-size: 0.7rem;">
              Forgot Auth Code? Contact Tech Support
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="index.js"></script> <!-- login logic -->
  <script>
    // Preloader fade-out on page load
    window.addEventListener("load", () => {
      const preloader = document.getElementById("preloader");
      preloader.classList.add("hidden");
    });

  </script>
</body>
</html>
